<style>

const LEGAL={terms:"<h4>Who can use Leafcheck<\/h4>\n<p>You must be 21 or older and in the United States. Leafcheck gives information about nicotine and tobacco products. It does not sell them, link to sellers, or encourage anyone to start using them. If you do not use nicotine, we suggest you do not start.<\/p>\n<h4>Information, not medical advice<\/h4>\n<p>Scores, nicotine estimates, plans and tips are estimates for information only. No nicotine product is risk-free, and nicotine is addictive. A score shows relative risk on our scale. It is not a claim that any product is safe, and it is not medical advice. Using Leafcheck does not create a doctor-patient relationship. Talk to a clinician about your situation. Free U.S. quit support: 1-800-QUIT-NOW.<\/p>\n<h4>Community rules<\/h4>\n<ul>\n<li>Share your own experience. Be kind. No harassment, hate, or content involving minors.<\/li>\n<li>No selling, offers, discount codes, \"DM me\", links to shops or contact details for sales.<\/li>\n<li>No medical claims or dosing instructions presented as advice.<\/li>\n<li>You can report any post, comment or review and block any user. We review reports within 24 hours, remove content that breaks these rules, and may suspend accounts.<\/li>\n<\/ul>\n<h4>Your content<\/h4>\n<p>You own what you post. You give Leafcheck a worldwide, non-exclusive license to host and display it in the app, and to review pack photos to verify products. Do not post anything you do not have the right to share, and do not include faces or personal information in photos.<\/p>\n<h4>Brands, trademarks and corrections<\/h4>\n<p>Product and brand names belong to their owners. Leafcheck is not affiliated with any brand. Brands cannot pay for or change a score. If you believe information about a product is wrong, email katherineilkhanibusiness@gmail.com with evidence. We review it and respond within 10 business days.<\/p>\n<h4>Copyright complaints<\/h4>\n<p>If you believe something posted in Leafcheck infringes your copyright, email katherineilkhanibusiness@gmail.com with the content, your contact details and a statement that you are the owner or authorized to act. We remove infringing content and suspend repeat infringers.<\/p>\n<h4>Subscriptions<\/h4>\n<p>Premium is available as Monthly ($3.99), Annual ($23.99) or Lifetime ($74.99). Monthly and Annual include a 7-day free trial. Payment is charged to your Apple Account at confirmation of purchase, after any trial. Subscriptions renew automatically unless cancelled at least 24 hours before the end of the current period. Manage or cancel in Settings > Apple Account > Subscriptions. Scanning, scores and safety information stay free.<\/p>\n<h4>Disclaimers and limits<\/h4>\n<p>Leafcheck is provided \"as is\". To the extent the law allows, we are not liable for decisions you make using the app. We may update or end features. We may suspend accounts that break these terms. You can delete your account at any time in Profile.<\/p>\n<h4>Contact<\/h4>\n<p>katherineilkhanibusiness@gmail.com. Effective October 16, 2026.<\/p>",privacy:"<h4>What we collect<\/h4>\n<ul>\n<li><b>Account:<\/b> email, password (stored hashed), display name, and optional username, phone and profile picture. Your birth year is used only to confirm you are 21 or older.<\/li>\n<li><b>Nicotine and health information you enter:<\/b> which products you use, how often, what you spend, your reasons for using or quitting, quit-plan settings, daily logs and cravings, and optional health conditions and U.S. state. This is sensitive information. You choose what to answer. Health conditions and state have a \"Prefer not to say\" option.<\/li>\n<li><b>What you do in the app:<\/b> products you scan, search or add, ratings, reviews, community posts and comments, votes, reports and blocks. Pack photos you choose to upload.<\/li>\n<li><b>Reports:<\/b> if you report a post, comment or review, we keep your reason and a copy of up to 300 characters of the reported text so staff can review it.<\/li>\n<li><b>Not collected:<\/b> precise location, contacts, advertising identifiers. We do not use third-party advertising or tracking SDKs.<\/li>\n<\/ul>\n<h4>Why we use it<\/h4>\n<ul>\n<li>To run the app: show your history, sync your quit tracker across your phones, and personalize ratings, warnings and craving tips.<\/li>\n<li>To keep the community safe and enforce our rules.<\/li>\n<li>To improve product data. Products you add are stored without your name.<\/li>\n<li><b>Research (off unless you turn it on):<\/b> if you opt in, anonymous answers may be counted in combined results. Results are reviewed only for groups of 10 or more people. You can turn this off in Profile at any time.<\/li>\n<\/ul>\n<h4>What we never do<\/h4>\n<ul>\n<li>We never sell your data and never use it for advertising or marketing.<\/li>\n<li>We never share your nicotine-use or health information with nicotine brands, retailers, advertisers or data brokers.<\/li>\n<li>Brands cannot pay to change a score or to see your information.<\/li>\n<\/ul>\n<h4>Who processes it for us<\/h4>\n<p>Our hosting and database providers, only to run Leafcheck for us. If you use Talk to AI, your question and the source text you are asking about are sent to our AI provider to produce an answer. We do not send your name, email, or tracker and health answers with it. We share information when the law requires it or to protect people from harm.<\/p>\n<h4>Your choices and rights<\/h4>\n<ul>\n<li><b>Access and download:<\/b> Profile > Download my data.<\/li>\n<li><b>Delete:<\/b> Profile > Delete my account and data. We delete your account data from live systems right away, and backups are overwritten within 35 days.<\/li>\n<li><b>Withdraw consent:<\/b> turn off research sharing in Profile, or delete your account. Withdrawing health-data consent means the quit tracker and personalization stop working.<\/li>\n<li>Residents of Washington, California and other states may have additional rights, including to know what we hold, correct it, delete it, and appeal a refusal. You may also use an authorized agent. Email katherineilkhanibusiness@gmail.com and we will respond within 45 days. We will not treat you differently for using these rights.<\/li>\n<\/ul>\n<h4>Retention and security<\/h4>\n<p>We keep your data until you delete your account. Data is encrypted in transit. If there is a security breach affecting your information, we will notify you and regulators as the law requires.<\/p>\n<h4>Sale, sharing and advertising<\/h4>\n<p>We do not sell personal information, we do not share it for cross-context behavioral advertising, and we do not use it to profile you for ads. We do not respond to \"Do Not Track\" signals because we do not track you across other sites or apps.<\/p>\n<h4>Sensitive information<\/h4>\n<p>Health and nicotine-use information is sensitive. We use it only to provide the features you asked for, which is why you give a separate consent for it. Our <b>Consumer Health Data Privacy Policy<\/b> is a separate page in Profile and on the welcome screen.<\/p>\n<h4>Adults only, United States only<\/h4>\n<p>Leafcheck is for people 21 and older in the United States. We ask for your birth month and year, and we do not create accounts for anyone under 21. We do not knowingly collect information from anyone under 21, and we delete it if we learn we have. Parents can email katherineilkhanibusiness@gmail.com.<\/p>\n<h4>Changes and contact<\/h4>\n<p>We will tell you in the app before material changes take effect. Questions or requests: katherineilkhanibusiness@gmail.com. Effective October 16, 2026.<\/p>",health:"<p><b>Consumer Health Data Privacy Policy.<\/b> Effective October 16, 2026. This policy covers only consumer health data, as Washington's My Health My Data Act and similar laws define it.<\/p>\n<h4>Categories of consumer health data we collect, and why<\/h4>\n<ul>\n<li><b>Nicotine and tobacco product use:<\/b> the products you use, how much and how often, first use after waking, spending, past quit attempts, and your readiness to cut back or quit.<\/li>\n<li><b>Quit plan and tracker data:<\/b> your plan, daily counts, cravings, moods and notes.<\/li>\n<li><b>Health conditions you choose to share:<\/b> for example pregnancy, heart or lung conditions, or mental health. Optional. You can pick \"Prefer not to say\".<\/li>\n<li><b>Your reasons for quitting or using, and your U.S. state.<\/b><\/li>\n<\/ul>\n<p><b>Purpose:<\/b> to personalize product ratings and warnings, build your quit plan and craving tips, estimate your nicotine intake, and sync these across your devices. We do not use it for advertising or marketing.<\/p>\n<h4>Categories of sources<\/h4>\n<p>Only you, by typing or tapping answers in the app. We do not buy or receive consumer health data from anyone else.<\/p>\n<h4>Categories of consumer health data we share<\/h4>\n<p>None. We do not sell it, and we do not share it with third parties or affiliates. Our hosting and database providers store it for us under contract and may not use it for their own purposes. If you turn on the optional research setting, only combined results for groups of 10 or more people are produced, with no names or emails.<\/p>\n<h4>Categories of third parties and affiliates we share with<\/h4>\n<p>None.<\/p>\n<h4>How to exercise your rights<\/h4>\n<ul>\n<li><b>Access:<\/b> Profile > Download my data.<\/li>\n<li><b>Withdraw consent:<\/b> Profile > Withdraw health-data consent. This deletes your nicotine-use, quit-tracker and health answers.<\/li>\n<li><b>Delete:<\/b> Profile > Delete my account and data. Live copies are deleted right away and backups are overwritten within 35 days.<\/li>\n<li><b>Questions, requests or an appeal if we refuse:<\/b> email katherineilkhanibusiness@gmail.com. We respond within 45 days.<\/li>\n<\/ul>",method:"<p>The 0 to 100 score is a <b>relative risk estimate<\/b>. 0 means no known health risk and 100 means significant health risk on our scale. <b>No nicotine product is risk-free<\/b>, and a lower score is not a claim that a product is safe or a reason to start using it.<\/p>\n<h4>How it is built (adds up to 100)<\/h4>\n<ul>\n<li><b>Type of product, up to 50:<\/b> cigarettes 50, other tobacco 40, vapes 22, oral pouches 12. This reflects published evidence on toxicant exposure by delivery type, for example the U.S. Surgeon General's 2014 report and the 2018 National Academies review of e-cigarettes.<\/li>\n<li><b>Nicotine dose, up to 20:<\/b> from the labeled strength and amount.<\/li>\n<li><b>Additives, up to 15:<\/b> from the ingredient list, each rated with the red, yellow, green dot.<\/li>\n<li><b>Regulatory status, 0 or 10:<\/b> whether the product has an FDA marketing order. We never write \"FDA approved\".<\/li>\n<li><b>Reported harms, up to 5:<\/b> from reports to the FDA Safety Reporting Portal. Reports are unverified.<\/li>\n<\/ul>\n<h4>What we will not do<\/h4>\n<ul>\n<li>Brands cannot pay to change, hide or improve a score.<\/li>\n<li>Sources are only peer-reviewed studies, FDA documents and research reports. Each product lists them.<\/li>\n<li>Products without enough verified data show \"Not yet rated\" instead of a guess.<\/li>\n<\/ul>\n<h4>Disagree with a score?<\/h4>\n<p>Email katherineilkhanibusiness@gmail.com with evidence. We review it, respond within 10 business days, and fix errors.<\/p>",rules:"<ul>\n<li>Share your own experience. Be kind.<\/li>\n<li>No selling, offers, discount codes, links to shops or \"DM me\".<\/li>\n<li>No content involving minors. This app is for adults 21+.<\/li>\n<li>No medical claims or dosing instructions presented as advice.<\/li>\n<\/ul>\n<p>Tap <b>Report<\/b> on any post, comment or review. We review reports within 24 hours. Tap <b>Block<\/b> to stop seeing a person. Manage blocked people in Profile.<\/p>\n<p class=\"note\">Contact: katherineilkhanibusiness@gmail.com<\/p>"};
