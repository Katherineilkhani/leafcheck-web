name: Uptime check
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: API health
        run: curl -fsS --retry 4 --retry-delay 15 --retry-all-errors --max-time 90 https://leafcheck-api-yny0.onrender.com/health | grep -q '"ok":true'
      - name: Products load
        run: curl -fsS --retry 2 --max-time 60 "https://leafcheck-api-yny0.onrender.com/products?limit=1" | grep -q '"id"'
      - name: Website loads
        run: curl -fsS --retry 2 --max-time 60 https://katherineilkhani.github.io/leafcheck-web/ | grep -q 'APP_V='
